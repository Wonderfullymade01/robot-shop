# kube-prometheus-stack: Prometheus + Grafana + Alertmanager, sized small for a 3-node demo cluster.
# No persistent disks: data lives only while the cluster runs (cheap, nothing left behind on destroy).

prometheus:
  prometheusSpec:
    retention: 2d
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }
    # Also pick up ServiceMonitors / PodMonitors / alert rules created outside this chart (Traefik, our SLO rules)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

grafana:
  # Admin login comes from a Kubernetes Secret created by hand, never from Git
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Load dashboards from ConfigMaps labelled grafana_dashboard: "1" (dashboards as code)
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
  # Logs and traces next to metrics, all in one Grafana
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.logging.svc:3100
    - name: Jaeger
      type: jaeger
      uid: jaeger
      url: http://jaeger.monitoring.svc:16686

# EKS runs the control plane for us, so these can't be scraped; turning them off avoids permanent "down" alerts
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

# Alertmanager: send SLO alerts to Slack. The webhook URL is read from a Kubernetes Secret, never from Git.
alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-slack          # mounted at /etc/alertmanager/secrets/alertmanager-slack/
  config:
    route:
      receiver: "null"              # by default, drop alerts (avoid noise from the built-in rules)
      group_by: [alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: slack
          matchers:
            - slo = "availability"  # only our SLO alert goes to Slack
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            channel: "#alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              Runbook: {{ .Annotations.runbook_url }}
              {{ end }}

