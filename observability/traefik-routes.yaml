# How Traefik sends requests to Robot Shop.
# One IngressRoute per service, so Traefik's metrics carry readable names
# (robot-shop-cart-..., robot-shop-payment-...) instead of a random hash.

# Removes the /api/<service> part before forwarding, like Robot Shop's own nginx does
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: robot-shop
spec:
  stripPrefix:
    prefixes:
      - /api/catalogue
      - /api/cart
      - /api/payment
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: catalogue
  namespace: robot-shop
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/api/catalogue/`)
      kind: Rule
      middlewares:
        - name: strip-api-prefix
      services:
        - name: catalogue
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cart
  namespace: robot-shop
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/api/cart/`)
      kind: Rule
      middlewares:
        - name: strip-api-prefix
      services:
        - name: cart
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: payment
  namespace: robot-shop
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/api/payment/`)
      kind: Rule
      middlewares:
        - name: strip-api-prefix
      services:
        - name: payment
          port: 8080
---
# Everything else (the shop pages and the other APIs) goes to web, which forwards them itself
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web
  namespace: robot-shop
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: web
          port: 8080
