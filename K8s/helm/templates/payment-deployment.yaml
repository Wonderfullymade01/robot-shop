apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels:
    service: payment
    stage: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      service: payment
      stage: prod
  template:
    metadata:
      labels:
        service: payment
        stage: prod
    spec:
      {{ if .Values.psp.enabled }}
      serviceAccountName: robot-shop
      {{ end }}
      {{- if .Values.payment.tracing.enabled }}
      # Install the OpenTelemetry Python libraries into a shared folder before payment starts.
      # Versions 1.27 / 0.48b0 still support payment's old Python 3.9.
      initContainers:
      - name: install-otel
        image: python:3.9-slim
        command: ["pip", "install", "--no-cache-dir", "--target", "/otel",
                  "opentelemetry-distro==0.48b0",
                  "opentelemetry-exporter-otlp-proto-http==1.27.0",
                  "opentelemetry-instrumentation-flask==0.48b0",
                  "opentelemetry-instrumentation-requests==0.48b0"]
        volumeMounts:
        - name: otel
          mountPath: /otel
      {{- end }}
      containers:
      - name: payment
        image: {{ .Values.image.repo }}/rs-payment:{{ .Values.image.version }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if .Values.payment.tracing.enabled }}
        # Run with Flask's own server (one process) so the tracing library starts cleanly
        command: ["python", "payment.py"]
        {{- end }}
        env:
          {{- if .Values.payment.gateway }}
          - name: PAYMENT_GATEWAY
            value: {{ .Values.payment.gateway }}
          {{- end }}
          {{- if .Values.payment.tracing.enabled }}
          # Load OpenTelemetry automatically when Python starts (no code changes)
          - name: PYTHONPATH
            value: /otel/opentelemetry/instrumentation/auto_instrumentation:/otel
          - name: OTEL_SERVICE_NAME
            value: payment
          - name: OTEL_TRACES_EXPORTER
            value: otlp
          - name: OTEL_METRICS_EXPORTER
            value: none
          - name: OTEL_LOGS_EXPORTER
            value: none
          - name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: http/protobuf
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: {{ .Values.payment.tracing.endpoint }}
          {{- end }}
        {{- if .Values.payment.tracing.enabled }}
        volumeMounts:
        - name: otel
          mountPath: /otel
        {{- end }}
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
      {{- if .Values.payment.tracing.enabled }}
      volumes:
      - name: otel
        emptyDir: {}
      {{- end }}
      {{- with .Values.payment.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.payment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.payment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
